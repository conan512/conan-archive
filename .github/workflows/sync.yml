name: Sync Telegram & Deploy

on:
  schedule:
    - cron: "*/15 * * * *"   # هر ۱۵ دقیقه پست‌های جدید را می‌کشد
  workflow_dispatch:          # اجرای دستی از تب Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install beautifulsoup4 lxml

      - name: Fetch new Telegram posts
        env:
          TG_CHANNEL: DetectiveConanIR
          MAX_PAGES: "6"          # فقط صفحات جدید؛ آرشیو قبلی در posts.json محفوظ است
        run: python scraper/fetch.py

      - name: Build static site
        run: python generator/site.py

      - name: Commit updated archive
        run: |
          git config user.name "conan-archive-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posts.json
          git diff --staged --quiet || git commit -m "sync: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
